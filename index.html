<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#imgTela{
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    margin:auto;
}
</style>
</head>
<body>

<img id="imgTela" src="imagem.jpg?t=1">

<script>
setInterval(function(){
    document.getElementById("imgTela").src = "imagem.jpg?t=" + new Date().getTime();
}, 20000);
</script>

</body>
</html>
